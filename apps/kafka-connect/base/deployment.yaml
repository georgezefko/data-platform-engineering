apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: develop
  labels:
    app: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      containers:
        - name: kafka-connect
          image: quay.io/debezium/connect:2.7
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka-svc.develop.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "debezium-connect"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium_connect_configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium_connect_offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium_connect_statuses"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until curl -sf http://localhost:8083/connectors; do
                      sleep 5
                    done
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                      http://localhost:8083/connectors/postgres-connector)
                    if [ "$STATUS" = "404" ]; then
                      curl -s -X POST http://localhost:8083/connectors \
                        -H "Content-Type: application/json" -d @/config/connector.json
                    else
                      curl -s -X PUT \
                        http://localhost:8083/connectors/postgres-connector/config \
                        -H "Content-Type: application/json" -d @/config/connector-config.json
                    fi
          volumeMounts:
            - name: connector-config
              mountPath: /config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: connector-config
          configMap:
            name: debezium-connector-config
