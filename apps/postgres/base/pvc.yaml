apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  annotations:
    # keep the data when postgres-app is turned off (its finalizer deletes everything else)
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: 
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 1Gi