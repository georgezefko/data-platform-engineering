# Creates the Airflow metadata databases; skips databases that exist.
# (init.sql only runs on an empty volume, so it can't add databases to an existing cluster.)
# A plain resource, not a hook: hooks don't count toward sync status, so on an already-synced
# postgres-app a new hook never fires. Job spec is immutable: if you edit it, delete the Job first.
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-db-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: debezium/postgres:15
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGHOST
              value: postgres
          command: ["bash", "-c"]
          args:
            - |
              set -e
              export PGUSER=$POSTGRES_USER PGPASSWORD=$POSTGRES_PASSWORD
              until pg_isready; do sleep 2; done
              for db in airflow_dev airflow_prod; do
                psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 \
                  || psql -d postgres -c "CREATE DATABASE $db"
              done
