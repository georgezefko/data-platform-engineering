# Prod: each team pinned to its release tag. A release = change that team's tracking_ref, nothing else.
images:
  airflow:
    tag: 3.3.2-385e98c # promoted from dev by hand

data:
  metadataConnection:
    db: airflow_prod


config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: gs://project-09344e23-c1cd-49df-a40-airflow-logs/prod

dagProcessor:
  dagBundleConfigList:
    - name: platform
      classpath: airflow.providers.git.bundles.git.GitDagBundle
      kwargs: {repo_url: "https://github.com/georgezefko/airflow-monorepo.git", tracking_ref: platform-v1.1.0, subdir: teams/platform/dags}  # no platform-v* tag yet
    - name: sales
      classpath: airflow.providers.git.bundles.git.GitDagBundle
      kwargs: {repo_url: "https://github.com/georgezefko/airflow-monorepo.git", tracking_ref: sales-v1.1.0, subdir: teams/sales/dags}
    - name: marketing
      classpath: airflow.providers.git.bundles.git.GitDagBundle
      kwargs: {repo_url: "https://github.com/georgezefko/airflow-monorepo.git", tracking_ref: marketing-v1.1.0, subdir: teams/marketing/dags}  # no marketing-v* tag yet