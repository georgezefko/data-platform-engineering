# Shared by dev and prod. Contract: https://github.com/georgezefko/airflow-monorepo/blob/main/docs/deployment.md
airflowVersion: "3.3.2"
executor: KubernetesExecutor

images:
  airflow:
    # repository is per env (each env's own GCP project registry)
    pullPolicy: IfNotPresent  # loaded with `kind load`, never pulled (registry tokens last 1h)

# Metadata DB: the platform Postgres in `develop`; each env has its own database
postgresql:
  enabled: false
data:
  metadataConnection:
    user: postgres
    pass: postgres
    protocol: postgresql
    host: postgres.develop.svc.cluster.local
    port: 5432
    sslmode: disable

# Argo CD doesn't run Helm hooks the way Helm does: run the jobs as Argo sync hooks instead
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

statsd:
  enabled: false

# BigQuery credentials: Secret created by `make airflow-secrets`, never in git.
# Top-level env/volumes reach every component and the KubernetesExecutor task pods.
volumes:
  - name: gcp-adc
    secret:
      secretName: airflow-gcp-adc
volumeMounts:
  - name: gcp-adc
    mountPath: /opt/gcp
    readOnly: true
# Fernet/API/JWT keys: Secret `airflow-keys` created by `make airflow-secrets`, never in git.
# (If the chart generated them, Argo would rotate them on every sync.)
fernetKeySecretName: airflow-keys
apiSecretKeySecretName: airflow-keys
jwtSecretName: airflow-keys

# kind runs dev + prod + the rest of the platform on one node, so Airflow starts slowly.
# Defaults killed the api-server (startup probe) and scheduler (liveness probe) before they were up.
config:
  api:
    workers: 1  # default 4: each worker imports all of Airflow at startup
  # Cosmos runs `dbt ls` while a dbt DAG file imports: slower than the 30s default on a busy
  # kind node, more so with a cold cache after a restart.
  core:
    dagbag_import_timeout: 120
  dag_processor:
    dag_file_processor_timeout: 180  # must stay above dagbag_import_timeout
    # Lighter on kind: re-import each DAG file every 5 min (default 30s, and each import of a
    # Cosmos DAG can run `dbt ls`), one parsing process (default 2). A merge to main can take up
    # to 5 min to show in dev.
    min_file_process_interval: 300
    parsing_processes: 1
apiServer:
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 30  # up to 5 min to come up
scheduler:
  startupProbe:  # default gave up after ~1-2 min; boot (cosmos/dbt imports) takes longer
    periodSeconds: 10
    timeoutSeconds: 60
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 60
    failureThreshold: 5

# No DAG uses deferrable operators (app_task's KubernetesPodOperator and Cosmos don't defer), so
# the triggerer would sit idle. Re-enable it if a DAG starts deferring: its tasks would hang.
triggerer:
  enabled: false
